<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../HL1.css" />
    <link rel="stylesheet" href="../index.css" />
    <link rel="icon" type="image/x-icon" href="../../public/favicon.ico" />
    <title>HL1</title>
  </head>
  <body>
    <header>
      <div class="top">
        <button class="hl-btn mbb-2" id="back-btn">&lt;&lt; Back</button>
        <h2 style="color: #c4b550">Layout</h2>
      </div>
      <hr class="hl-hr" />
    </header>

    <main>
      <!-- # Container -->
      <div id="Container" class="hl-con">
        <h2 style="color: #c4b550"># Container</h2>

        <div class="hl-con-s"></div>
        <br />
        <div class="hl-con-m"></div>
        <br />
        <div class="hl-con"></div>
        <br />

        <div class="code-block">
          <button class="hl-btn toggle-vision">Show code</button>

          <div class="inner hidden">
            <button class="hl-btn">Copy</button>

            <pre><code id="code-block">&lt;div class=&quot;hl-con-s&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;hl-con-m&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;hl-con&quot;&gt;&lt;/div&gt;</code></pre>
          </div>
        </div>
      </div>
      <!-- # Grid -->
      <div id="Grid" class="hl-con">
        <h2 style="color: #c4b550"># Grid</h2>

        <div class="hl-grid hl-grid-3">
          <div class="hl-box">1</div>
          <div class="hl-box">2</div>
          <div class="hl-box">3</div>
          <div class="hl-box hl-span-2">span 2</div>
          <div class="hl-box">5</div>
          <div class="hl-box hl-span-full">full width</div>
        </div>
        <br />
        <div class="hl-grid hl-grid-auto">
          <div class="hl-box">A</div>
          <div class="hl-box">B</div>
          <div class="hl-box">C</div>
        </div>

        <div class="code-block">
          <button class="hl-btn toggle-vision">Show code</button>

          <div class="inner hidden">
            <button class="hl-btn">Copy</button>

            <pre><code></code></pre>
          </div>
        </div>
      </div>
      <!-- # Columns -->
      <div id="Columns" class="hl-con">
        <h2 style="color: #c4b550"># Columns</h2>

        <div class="hl-cols">
          <div class="hl-col hl-box">col</div>
          <div class="hl-col hl-box">col</div>
          <div class="hl-col hl-box">col</div>
        </div>
        <br />
        <div class="hl-cols">
          <div class="hl-col-25 hl-box">25%</div>
          <div class="hl-col hl-box">auto</div>
        </div>

        <div class="code-block">
          <button class="hl-btn toggle-vision">Show code</button>

          <div class="inner hidden">
            <button class="hl-btn">Copy</button>

            <pre><code></code></pre>
          </div>
        </div>
      </div>
    </main>

    <footer style="color: #fb821b">Made by TAE</footer>
  </body>
</html>
<script type="module" src="../HL1.js" defer></script>
<script type="module" src="./framework-tabs.js"></script>
<script>
  document.getElementById("back-btn").addEventListener("click", function () {
    window.location.href = "/";
  });
</script>
